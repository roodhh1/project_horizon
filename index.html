<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Beacon</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Beacon">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)">
<style>
:root{
  --bg:#fafafa; --surface:#fff; --ink:#18181b; --body:#3f3f46; --sub:#71717a; --faint:#a1a1aa;
  --line:#ececef; --line2:#f4f4f5; --hover:#f7f7f8; --chip:#f4f4f5; --seg:#efeff1;
  --accent:#2563eb; --accent-soft:#eff4ff;
  --green:#16a34a; --green-soft:#eaf7ef; --teal:#0d9488; --teal-soft:#e8f6f5;
  --amber:#b45309; --amber-soft:#fdf4e6; --red:#dc2626; --red-soft:#fdeeee; --gray-soft:#f1f1f3;
  --beacon:#f59e0b; --radius:16px;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0b0b0c; --surface:#161618; --ink:#f4f4f5; --body:#d4d4d8; --sub:#a1a1aa; --faint:#71717a;
  --line:#26262a; --line2:#1f1f22; --hover:#1c1c1f; --chip:#232326; --seg:#232326;
  --accent:#60a5fa; --accent-soft:rgba(96,165,250,.14);
  --green:#4ade80; --green-soft:rgba(74,222,128,.13); --teal:#2dd4bf; --teal-soft:rgba(45,212,191,.13);
  --amber:#fbbf24; --amber-soft:rgba(251,191,36,.13); --red:#f87171; --red-soft:rgba(248,113,113,.13); --gray-soft:#232326;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:inherit;text-decoration:none} button{font:inherit;color:inherit}
.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* top bar */
.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);border-bottom:1px solid var(--line)}
.top .in{max-width:960px;margin:0 auto;height:56px;display:flex;align-items:center;gap:18px;padding:0 20px}
.brand{display:flex;align-items:center;gap:8px;font-weight:650;font-size:17px;letter-spacing:-.02em;cursor:pointer}
.brand svg{color:var(--beacon)}
.nav{display:flex;gap:2px;margin-left:auto;background:var(--seg);padding:3px;border-radius:12px}
.nav a{display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:9px;font-size:13.5px;font-weight:550;color:var(--sub);cursor:pointer}
.nav a.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.nav a .n{font-size:11px;font-weight:650;color:var(--faint)}

.wrap{max-width:960px;margin:0 auto;padding:30px 20px 90px}
.view{animation:f .25s ease} @keyframes f{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
h1{font-size:30px;font-weight:680;letter-spacing:-.03em;margin:0;line-height:1.1}
.lede{color:var(--sub);font-size:14.5px;margin:6px 0 0}
.live{display:inline-flex;align-items:center;gap:6px}
.live i{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:22px 0 6px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer}
.stat:hover{border-color:var(--faint)}
.stat .v{font-size:26px;font-weight:680;letter-spacing:-.03em;line-height:1}
.stat .l{color:var(--sub);font-size:12.5px;margin-top:6px}
.stat .v small{font-size:13px;color:var(--faint);font-weight:550;margin-left:3px}

/* sections */
.sh{display:flex;align-items:baseline;gap:8px;margin:30px 2px 10px}
.sh h2{font-size:15px;font-weight:650;letter-spacing:-.01em;margin:0}
.sh .c{color:var(--faint);font-size:13px}
.sh .more{margin-left:auto;font-size:13px;color:var(--accent);cursor:pointer;font-weight:550}
.sh .dot{width:8px;height:8px;border-radius:50%;align-self:center}
.hint{color:var(--faint);font-size:12.5px;margin:-6px 2px 10px}

/* list rows */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.row{display:flex;align-items:center;gap:13px;padding:13px 16px;border-top:1px solid var(--line2);cursor:pointer}
.row:first-child{border-top:0} .row:hover{background:var(--hover)}
.logo{width:38px;height:38px;border-radius:10px;flex-shrink:0;display:grid;place-items:center;position:relative;overflow:hidden;
  color:#fff;font-weight:650;font-size:15px}
.logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;padding:6px;opacity:0}
.logo img.ok{opacity:1}
.row .m{flex:1;min-width:0}
.row .co{font-size:11px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;color:var(--faint)}
.row .t{font-size:14.5px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px;font-size:12.5px;color:var(--sub)}
.row .note{font-size:12.5px;color:var(--sub);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row .note b{color:var(--body);font-weight:600}
.row .r{display:flex;align-items:center;gap:10px;flex-shrink:0;color:var(--faint)}
.age{font-size:12px;color:var(--faint);white-space:nowrap}
.age.stale{color:var(--amber)}

/* chips */
.b{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:620;padding:2px 8px;border-radius:99px;white-space:nowrap}
.b.blue{background:var(--accent-soft);color:var(--accent)} .b.green{background:var(--green-soft);color:var(--green)}
.b.teal{background:var(--teal-soft);color:var(--teal)} .b.amber{background:var(--amber-soft);color:var(--amber)}
.b.red{background:var(--red-soft);color:var(--red)} .b.gray{background:var(--gray-soft);color:var(--sub)}
.who{display:inline-flex;align-items:center;gap:4px;color:var(--body)}
.who .ic{width:13px;height:13px;color:var(--faint)}
.score{font-size:12px;font-weight:650;padding:3px 8px;border-radius:8px;min-width:34px;text-align:center}

/* controls */
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:20px 0 14px}
.seg{display:inline-flex;background:var(--seg);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;font-size:13px;font-weight:550;color:var(--sub);padding:6px 13px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.search{display:flex;align-items:center;gap:8px;flex:1;min-width:180px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 12px;color:var(--faint)}
.search input{border:0;outline:0;background:transparent;font:inherit;font-size:14px;color:var(--ink);width:100%}
.count{color:var(--faint);font-size:12.5px;margin:0 2px 10px}

details.fold{margin-top:10px}
details.fold summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:10px 4px;color:var(--sub);font-size:13.5px;font-weight:550}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary .ic{transition:transform .15s} details.fold[open] summary .ic{transform:rotate(90deg)}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);padding:26px;text-align:center;color:var(--sub);font-size:13.5px}

/* funnel */
.funnel{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--seg);margin:12px 0 8px}
.funnel i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--sub)}
.legend span{display:inline-flex;align-items:center;gap:6px} .legend b{color:var(--ink);font-weight:650}
.legend em{width:8px;height:8px;border-radius:50%;display:inline-block}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}

/* detail */
.back{display:inline-flex;align-items:center;gap:3px;color:var(--accent);font-size:14px;font-weight:550;cursor:pointer;margin-bottom:18px}
.dh{display:flex;gap:16px;align-items:center}
.dh .logo{width:56px;height:56px;border-radius:14px;font-size:22px}
.dh .co{font-size:12px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;color:var(--faint)}
.dh h1{font-size:24px;margin-top:2px}
.dh .loc{color:var(--sub);font-size:13.5px;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;font-weight:600;font-size:14px;padding:11px 18px;border-radius:12px}
@media (prefers-color-scheme: dark){.btn{color:#0b0b0c}}
.panels{display:grid;gap:10px;margin-top:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
.panel h3{margin:0 0 8px;font-size:11.5px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.panel p,.panel div.tx{margin:0;font-size:14.5px;color:var(--body);line-height:1.55}
.panel b{color:var(--ink)}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:6px 0}
.kv span:first-child{color:var(--sub)}
.fitbars{display:grid;gap:8px;margin-top:4px}
.fb{display:flex;align-items:center;gap:10px;font-size:13px}
.fb span:first-child{width:86px;color:var(--sub)} .fb .tr{flex:1;height:5px;background:var(--seg);border-radius:4px;overflow:hidden}
.fb .tr i{display:block;height:100%;border-radius:4px;background:var(--accent)} .fb b{width:18px;text-align:right}
.foot{color:var(--faint);font-size:12px;text-align:center;margin-top:40px}

@media (max-width:700px){
  .wrap{padding:22px 16px 110px}
  h1{font-size:26px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .top{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--bg)}
  .top .in{padding:0 16px}
  .nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));margin:0;justify-content:space-around;
    background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    border:1px solid var(--line);border-radius:16px;padding:5px;box-shadow:0 8px 30px rgba(0,0,0,.12)}
  .nav a{flex:1;justify-content:center;flex-direction:column;gap:2px;font-size:11px;padding:6px}
  .row .r .age{display:none}
}
</style>
</head>
<body>
<header class="top"><div class="in">
  <div class="brand" onclick="go('#/')">
    <svg class="ic" viewBox="0 0 24 24" style="width:22px;height:22px"><path d="M9 8.6a5 5 0 0 0 0 6.8"/><path d="M6.3 5.9a9 9 0 0 0 0 12.2"/><path d="M15 8.6a5 5 0 0 1 0 6.8"/><path d="M17.7 5.9a9 9 0 0 1 0 12.2"/><circle cx="12" cy="12" r="2.3" fill="currentColor" stroke="none"/></svg>
    Beacon
  </div>
  <nav class="nav" id="nav">
    <a data-r="#/" onclick="go('#/')">Today</a>
    <a data-r="#/pipeline" onclick="go('#/pipeline')">Pipeline</a>
    <a data-r="#/roles" onclick="go('#/roles')">Roles</a>
  </nav>
</div></header>
<main class="wrap" id="app"><div class="empty">Loading…</div></main>

<script>
let ROLES=[], VERIFIED='';
const QUIET=30;                       // days without movement before an application counts as "gone quiet"
const DEAD=new Set(['rejected','closed','passed']);

/* ---------- helpers ---------- */
const I={
  chevR:'<path d="m9 6 6 6-6 6"/>', chevL:'<path d="m15 6-6 6 6 6"/>', search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/>',
  user:'<circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/>', ext:'<path d="M14 4h6v6"/><path d="M20 4 11 13"/><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/>'
};
const ic=(n,s='')=>`<svg class="ic" viewBox="0 0 24 24" ${s}>${I[n]}</svg>`;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const strip=s=>String(s??'').replace(/<[^>]+>/g,'');
const key=r=>r.co+'|'+r.role, enc=encodeURIComponent, dec=decodeURIComponent;
const stage=r=>(r.app&&r.app.stage)||null;
const toDate=d=>{if(!d||typeof d!=='string')return null;const x=new Date(d.slice(0,10)+'T00:00:00');return isNaN(x)?null:x;};
const days=d=>{const x=toDate(d);return x?Math.max(0,Math.round((Date.now()-x)/864e5)):null;};
const md=d=>{const x=toDate(d);return x?x.toLocaleDateString('en-US',{month:'short',day:'numeric'}):'';};
const ago=n=>n==null?'':n===0?'today':n===1?'1d':n<60?n+'d':Math.round(n/30)+'mo';
const since=r=>days(r.app&&r.app.since);

const MGR=/(manager|head of|director|leader|\bvp\b|chief)/i;
const NOT_DS=/(product manager|engineering manager|program manager|product marketing|director of product|design|engineering|partner manager|account manager|people analytics|recruit)/i;
const isMgrDS=r=>r.track!=='pm'&&r.kind!=='pm'&&MGR.test(r.role)&&!NOT_DS.test(r.role);

const DOM={uber:'uber.com',discord:'discord.com',tiktok:'tiktok.com',openai:'openai.com',stripe:'stripe.com','capital one':'capitalone.com',
  adobe:'adobe.com',robinhood:'robinhood.com',doordash:'doordash.com',ebay:'ebay.com',autodesk:'autodesk.com',sentilink:'sentilink.com',
  trustly:'trustly.com',instacart:'instacart.com',zoox:'zoox.com',playstation:'playstation.com',sofi:'sofi.com',google:'google.com',
  netflix:'netflix.com',apple:'apple.com',reddit:'reddit.com',figma:'figma.com',waymo:'waymo.com',databricks:'databricks.com',
  snowflake:'snowflake.com',coupang:'coupang.com',nubank:'nubank.com.br',duolingo:'duolingo.com','customer.io':'customer.io',gusto:'gusto.com',
  plaid:'plaid.com',brex:'brex.com',ramp:'ramp.com',mercury:'mercury.com',chime:'chime.com',affirm:'affirm.com',anthropic:'anthropic.com',
  airbnb:'airbnb.com',pinterest:'pinterest.com',faire:'faire.com',roblox:'roblox.com',oscar:'hioscar.com',meta:'meta.com',
  coinbase:'coinbase.com',lyft:'lyft.com',samsara:'samsara.com',root:'joinroot.com',moonpay:'moonpay.com',cohere:'cohere.com',
  richemont:'richemont.com',life360:'life360.com','stitch fix':'stitchfix.com',attentive:'attentive.com',canva:'canva.com',
  yahoo:'yahoo.com',shipt:'shipt.com',brigit:'hellobrigit.com','wells fargo':'wellsfargo.com',superhuman:'superhuman.com',
  abridge:'abridge.com',checkr:'checkr.com',salesforce:'salesforce.com',rocket:'rocket.com',peloton:'onepeloton.com',
  'credit genie':'creditgenie.com',sagesure:'sagesure.com','the trade desk':'thetradedesk.com',tranzact:'tranzact.net',
  'samba tv':'samba.tv',vendelux:'vendelux.com',liberty:'libertymutual.com',meredith:'people.inc'};
function domainOf(co){const c=co.toLowerCase();const k=Object.keys(DOM).sort((a,b)=>b.length-a.length).find(k=>c.startsWith(k));return k?DOM[k]:null;}
const PAL=['#2563eb','#7c3aed','#0d9488','#b45309','#db2777','#16a34a','#dc2626','#4f46e5'];
function logo(co){
  const d=domainOf(co), col=PAL[[...co].reduce((a,c)=>a+c.charCodeAt(0),0)%PAL.length];
  return `<div class="logo" style="background:${col}">${esc(co[0])}${d?`<img src="https://www.google.com/s2/favicons?sz=128&domain=${d}" alt="" onload="if(this.naturalWidth>20)this.classList.add('ok');else this.remove()" onerror="this.remove()">`:''}</div>`;
}
const STG={'to-apply':['To apply','blue'],'applied':['Applied','teal'],'in-process':['In process','green'],
  'rejected':['Rejected','red'],'closed':['Closed','gray'],'passed':['Archived','gray']};
const badge=st=>STG[st]?`<span class="b ${STG[st][1]}">${STG[st][0]}</span>`:'';
const COMP={at:['Clears comp','green'],clears:['Clears comp','green'],border:['Borderline comp','amber'],below:['Below comp','gray']};
const compB=r=>COMP[r.compFit]?`<span class="b ${COMP[r.compFit][1]}">${COMP[r.compFit][0]}</span>`:'';
const scoreB=r=>r.score!=null?`<span class="score" style="background:${r.score>=8?'var(--green-soft)':r.score>=7?'var(--amber-soft)':'var(--gray-soft)'};color:${r.score>=8?'var(--green)':r.score>=7?'var(--amber)':'var(--sub)'}">${Number(r.score).toFixed(1)}</span>`:'';
const WARM=new Set(['active','warm','direct']);
function contact(r){const t=(r.referral||{}).text||'';const all=[...t.matchAll(/<b>([^<]+)<\/b>/g)].map(m=>m[1].replace(/^1st:?\s*/i,'').replace(/^Referred.*?by\s+/i,'').trim());
  const nm=all.find(n=>/^[A-Z][\p{L}'.-]+(\s[A-Z][\p{L}'.,-]*){1,3}$/u.test(n)&&!/\.$/.test(n)&&n.length<40);if(nm)return nm.replace(/,.*$/,'');
  const m=t.match(/(?:referred(?: 9\/\d+)? by|via)\s+([A-Z][\p{L}]+\s[A-Z][\p{L}]+)/u);return m?m[1]:'';}
const isCold=r=>/cold/i.test((r.app&&r.app.note)||'');
const isQuiet=r=>{const n=since(r);return n==null||n>QUIET;};

/* ---------- row ---------- */
function row(r,o={}){
  const st=stage(r), n=since(r), who=contact(r);
  const meta=[];
  if(o.stage!==false&&st) meta.push(badge(st));
  if(who&&!DEAD.has(st)&&!isCold(r)) meta.push(`<span class="who">${ic('user')}${esc(who)}</span>`);
  if(!st&&r.posted) meta.push(`<span>Posted ${md(r.posted)}</span>`);
  if(st==='applied'&&isCold(r)) meta.push(`<span class="b gray">Cold</span>`);
  if(o.loc) meta.push(`<span>${esc((r.loc||'').split(/[;|]/)[0])}</span>`);
  if(o.comp) meta.push(compB(r));
  const age=st?(n!=null?`<span class="age${!DEAD.has(st)&&n>QUIET?' stale':''}" title="since last update">${ago(n)}</span>`:''):(r.posted?`<span class="age">${ago(days(r.posted))}</span>`:'');
  return `<div class="row" onclick="go('#/role/${enc(key(r))}')">
    ${logo(r.co)}
    <div class="m"><div class="co">${esc(r.co)}</div><div class="t">${esc(r.role)}</div>
      ${meta.length?`<div class="s">${meta.join('')}</div>`:''}
      ${o.note&&r.app&&r.app.note?`<div class="note">${esc(strip(r.app.note))}</div>`:''}
    </div>
    <div class="r">${o.score?scoreB(r):''}${age}${ic('chevR')}</div>
  </div>`;
}
const list=(rows,o,empty)=>rows.length?`<div class="list">${rows.map(r=>row(r,o)).join('')}</div>`:`<div class="empty">${empty||'Nothing here.'}</div>`;
const bySince=(a,b)=>(since(a)??9999)-(since(b)??9999);
function sec(title,count,opts={}){return `<div class="sh">${opts.dot?`<span class="dot" style="background:${opts.dot}"></span>`:''}<h2>${title}</h2>${count!=null?`<span class="c">${count}</span>`:''}${opts.more?`<span class="more" onclick="go('${opts.more}')">${opts.moreLabel||'See all'} →</span>`:''}</div>${opts.hint?`<div class="hint">${opts.hint}</div>`:''}`;}

/* ---------- data slices ---------- */
const S={
  inproc:()=>ROLES.filter(r=>stage(r)==='in-process').sort(bySince),
  applied:()=>ROLES.filter(r=>stage(r)==='applied').sort(bySince),
  toApply:()=>ROLES.filter(r=>stage(r)==='to-apply').sort((a,b)=>(b.score??0)-(a.score??0)),
  dead:()=>ROLES.filter(r=>DEAD.has(stage(r))).sort(bySince),
  fresh:(win)=>ROLES.filter(r=>!stage(r)&&isMgrDS(r)&&(r.status||{}).live!==false&&(win==null||(days(r.posted)!=null&&days(r.posted)<=win)))
            .sort((a,b)=>(days(a.posted)??9999)-(days(b.posted)??9999)),
};

/* ---------- Today ---------- */
function today(){
  const ip=S.inproc(), ap=S.applied(), ta=S.toApply();
  const moving=ip.filter(r=>!isQuiet(r)), quietIP=ip.filter(isQuiet);
  const waiting=ap.filter(r=>!isQuiet(r)&&!isCold(r)&&(WARM.has((r.referral||{}).level)||contact(r)));
  const recentCold=ap.filter(r=>!isQuiet(r)&&!waiting.includes(r));
  const fresh=S.fresh(14);
  const all=ROLES.filter(r=>r.app&&r.app.stage!=='to-apply');
  const cnt=k=>all.filter(r=>stage(r)===k).length;
  const F=[['in-process','var(--green)'],['applied','var(--teal)'],['rejected','var(--red)'],['closed','var(--faint)'],['passed','var(--line)']];
  const tot=all.length||1;
  const dt=new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
  return `<div class="view">
    <h1>Today</h1>
    <p class="lede">${dt} · <span class="live"><i></i>verified ${md(VERIFIED)||'—'}</span></p>
    <div class="stats">
      <div class="stat" onclick="go('#/pipeline')"><div class="v">${moving.length}</div><div class="l">Moving</div></div>
      <div class="stat" onclick="go('#/pipeline')"><div class="v">${waiting.length}</div><div class="l">Contact working it</div></div>
      <div class="stat" onclick="go('#/pipeline')"><div class="v">${ap.filter(r=>!isQuiet(r)).length}<small>/ ${ap.length}</small></div><div class="l">Applied, last ${QUIET}d</div></div>
      <div class="stat" onclick="go('#/roles')"><div class="v">${fresh.length}</div><div class="l">New roles, 14d</div></div>
    </div>

    ${sec('Moving',moving.length,{dot:'var(--green)',hint:'Active interview loops.'})}
    ${list(moving,{note:true,stage:false},'No active loops right now.')}

    ${sec('A contact is working it',waiting.length,{dot:'var(--teal)',hint:'Applied in the last '+QUIET+' days with a referral or intro in motion.'})}
    ${list(waiting,{stage:false},'No referrals in motion.')}

    ${ta.length?sec('Up next',ta.length,{dot:'var(--accent)',hint:'Queued to apply.'})+list(ta,{comp:true,score:true,stage:false}):''}

    ${sec('New roles',fresh.length,{more:'#/roles',moreLabel:'All roles',hint:'People-manager DS roles posted in the last 14 days that aren’t in your pipeline.'})}
    ${list(fresh.slice(0,5),{loc:true},'Nothing new in the last 14 days.')}

    ${recentCold.length?`<details class="fold"><summary>${ic('chevR')} Applied cold, no contact yet · ${recentCold.length}</summary>${list(recentCold,{stage:false})}</details>`:''}
    ${quietIP.length?`<details class="fold"><summary>${ic('chevR')} In process but quiet for ${QUIET}+ days · ${quietIP.length}</summary>${list(quietIP,{note:true,stage:false})}</details>`:''}

    ${sec('Search to date',all.length)}
    <div class="card">
      <div class="funnel">${F.map(([k,c])=>`<i style="width:${cnt(k)/tot*100}%;background:${c}"></i>`).join('')}</div>
      <div class="legend">${F.map(([k,c])=>`<span><em style="background:${c}"></em><b>${cnt(k)}</b> ${STG[k][0].toLowerCase()}</span>`).join('')}</div>
    </div>
    <div class="foot">Roles re-verified daily against live job boards · pipeline from pipeline.json</div>
  </div>`;
}

/* ---------- Pipeline ---------- */
let pMode='active', pQ='', pDead='';
function pipeline(){
  const ip=S.inproc(), ap=S.applied(), ta=S.toApply(), dead=S.dead();
  const q=pQ.toLowerCase(), match=r=>!q||(r.co+' '+r.role).toLowerCase().includes(q);
  let body;
  if(pMode==='active'){
    const apR=ap.filter(r=>!isQuiet(r)&&match(r)), apQ=ap.filter(r=>isQuiet(r)&&match(r));
    const ipR=ip.filter(r=>!isQuiet(r)&&match(r)), ipQ=ip.filter(r=>isQuiet(r)&&match(r));
    body=`${sec('In process',ipR.length,{dot:'var(--green)'})}${list(ipR,{note:true,stage:false},'None.')}
      ${ipQ.length?`<details class="fold"><summary>${ic('chevR')} Quiet for ${QUIET}+ days · ${ipQ.length}</summary>${list(ipQ,{note:true,stage:false})}</details>`:''}
      ${sec('Applied',apR.length,{dot:'var(--teal)',hint:'Last '+QUIET+' days. Contact shown when a referral is in motion.'})}${list(apR,{stage:false},'None.')}
      ${apQ.length?`<details class="fold"><summary>${ic('chevR')} Gone quiet (${QUIET}+ days, no reply) · ${apQ.length}</summary>${list(apQ,{stage:false})}</details>`:''}
      ${sec('To apply',ta.filter(match).length,{dot:'var(--accent)'})}${list(ta.filter(match),{comp:true,score:true,stage:false},'Queue is empty.')}`;
  }else{
    const rows=dead.filter(r=>match(r)&&(!pDead||stage(r)===pDead));
    const f=[['','All'],['rejected','Rejected'],['closed','Closed'],['passed','Archived']];
    body=`<div class="bar" style="margin-top:0">${`<div class="seg">${f.map(([v,l])=>`<button class="${pDead===v?'on':''}" onclick="pDead='${v}';render()">${l}</button>`).join('')}</div>`}</div>
      <div class="count">${rows.length} of ${dead.length}</div>${list(rows,{},'Nothing here.')}`;
  }
  return `<div class="view">
    <h1>Pipeline</h1>
    <p class="lede">${ip.length} in process · ${ap.length} applied · ${ta.length} to apply · ${dead.length} closed out</p>
    <div class="bar">
      <div class="seg"><button class="${pMode==='active'?'on':''}" onclick="pMode='active';render()">Active</button><button class="${pMode==='archive'?'on':''}" onclick="pMode='archive';render()">Archive</button></div>
      <div class="search">${ic('search')}<input id="pq" placeholder="Search company or role" value="${esc(pQ)}" oninput="pQ=this.value;render(true)"></div>
    </div>
    ${body}
  </div>`;
}

/* ---------- Roles ---------- */
let rWin=30, rQ='', rSort='new';
function roles(){
  const q=rQ.toLowerCase();
  let rows=S.fresh(rWin).filter(r=>!q||(r.co+' '+r.role).toLowerCase().includes(q));
  if(rSort==='fit') rows=rows.slice().sort((a,b)=>(b.score??-1)-(a.score??-1));
  const W=[[7,'7 days'],[30,'30 days'],[null,'All']];
  return `<div class="view">
    <h1>Roles</h1>
    <p class="lede">Live people-manager data science roles from tracked company boards, not yet in your pipeline.</p>
    <div class="bar">
      <div class="seg">${W.map(([v,l])=>`<button class="${rWin===v?'on':''}" onclick="rWin=${v};render()">${l}</button>`).join('')}</div>
      <div class="seg"><button class="${rSort==='new'?'on':''}" onclick="rSort='new';render()">Newest</button><button class="${rSort==='fit'?'on':''}" onclick="rSort='fit';render()">Best fit</button></div>
      <div class="search">${ic('search')}<input id="rq" placeholder="Search company or role" value="${esc(rQ)}" oninput="rQ=this.value;render(true)"></div>
    </div>
    <div class="count">${rows.length} role${rows.length===1?'':'s'}</div>
    ${list(rows,{loc:true,score:true,comp:true},'No roles in this window. Try a wider range.')}
  </div>`;
}

/* ---------- Detail ---------- */
function detail(k){
  const r=ROLES.find(x=>key(x)===k);
  if(!r) return `<div class="empty">Role not found. <a style="color:var(--accent)" onclick="go('#/')">Back to Today</a></div>`;
  const st=stage(r), f=r.fit, rf=r.referral||{};
  const bars=f?[['Relevance',f.relevance],['Level',f.level],['Experience',f.experience],['Company',f.company]].filter(x=>x[1]!=null):[];
  return `<div class="view">
    <span class="back" onclick="history.length>1?history.back():go('#/')">${ic('chevL')} Back</span>
    <div class="dh">${logo(r.co)}<div><div class="co">${esc(r.co)}</div><h1>${esc(r.role)}</h1>
      <div class="loc">${esc(r.loc||'')}${r.posted?` · posted ${md(r.posted)}`:''}</div></div></div>
    <div class="chips">${badge(st)}${st&&r.app.since?`<span class="b gray">since ${md(r.app.since)}</span>`:''}${compB(r)}${r.score!=null?`<span class="b gray">fit ${Number(r.score).toFixed(1)}</span>`:''}</div>
    ${r.url?`<a class="btn" href="${esc(r.url)}" target="_blank" rel="noopener">Open posting ${ic('ext')}</a>`:''}
    <div class="panels">
      ${r.app&&r.app.note?`<div class="panel"><h3>Status</h3><p>${esc(strip(r.app.note))}</p></div>`:''}
      ${rf.text?`<div class="panel"><h3>Contact</h3><div class="tx">${rf.text}</div></div>`:''}
      ${r.note?`<div class="panel"><h3>Why it fits</h3><p>${esc(strip(r.note))}</p></div>`:''}
      ${r.comp||bars.length?`<div class="panel"><h3>Comp & fit</h3>
        ${r.comp?`<div class="kv"><span>Posted base</span><span>${esc(r.comp)}</span></div>`:''}
        ${bars.length?`<div class="fitbars">${bars.map(([l,v])=>`<div class="fb"><span>${l}</span><span class="tr"><i style="width:${v*10}%"></i></span><b>${v}</b></div>`).join('')}</div>`:''}
        ${f&&f.yoe_req?`<p style="font-size:13px;color:var(--sub);margin-top:10px">JD asks: ${esc(f.yoe_req)}</p>`:''}
      </div>`:''}
    </div>
  </div>`;
}

/* ---------- router ---------- */
function go(h){location.hash=h;}
function render(keepFocus){
  const h=location.hash||'#/', app=document.getElementById('app');
  const fid=keepFocus&&document.activeElement&&document.activeElement.id, pos=fid&&document.activeElement.selectionStart;
  let html,act='#/';
  if(h.startsWith('#/role/')){html=detail(dec(h.slice(7)));act=null;}
  else if(h.startsWith('#/pipeline')){html=pipeline();act='#/pipeline';}
  else if(h.startsWith('#/roles')){html=roles();act='#/roles';}
  else html=today();
  app.innerHTML=html;
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.r===act));
  if(fid){const el=document.getElementById(fid);if(el){el.focus();try{el.setSelectionRange(pos,pos);}catch(e){}}}
}
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0);});

fetch('roles.json',{cache:'no-store'})
  .then(r=>{if(!r.ok)throw new Error('roles.json '+r.status);return r.json();})
  .then(d=>{VERIFIED=d.verified_on||'';ROLES=(d.roles||[]).filter(r=>!r.hidden&&((r.status||{live:true}).live||r.pinned));render();})
  .catch(e=>{document.getElementById('app').innerHTML=`<div class="empty">Couldn't load roles.json (${esc(e.message)}).</div>`;});
</script>
</body>
</html>
